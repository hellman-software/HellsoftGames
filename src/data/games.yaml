- id: fightworld
  title: FightWorld
  order: 50
  listed: true
  status: playtest
  genre: Multiplayer action RPG
  blurb: A cosy multiplayer PvPvE brawler. Pick a class, explore a shared fantasy world, fight monsters and other players, and grow your hero.
  description: |
    FightWorld is a multiplayer PvPvE fighting game in a cute fantasy setting.
    Pick one of seven classes (Knight, Barbarian, Rogue, Ranger, Engineer,
    Mage or Druid), create your hero and head out from the tavern into the
    graveyard, the wilds and the forest edge.

    Combat is third-person with three class skills and a dodge roll. Level
    up to 30, find loot and gear, and take on the Skeleton Golem, the
    Necromancer and the Black Knight. Every other player can be a friend or a
    foe. The world is shared and persistent, with a day/night cycle, rain, a
    minimap, a leaderboard and chat.

    Sign in with Google or GitHub so your character is saved. Only your name
    and account ID are stored. Keyboard, mouse and gamepad are supported, and
    the music is synthesised in the browser. The game is in playtesting, so
    expect rough edges.
  playUrl: https://fightworld.fly.dev/
  repo: {owner: ErikHellman, name: FightWorld}
