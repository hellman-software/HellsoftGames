- id: parkour
  title: Parkour
  order: 60
  listed: true
  status: prototype
  genre: Third-person parkour
  blurb: Run, vault and climb through a brick-and-glass city district. An early vertical slice with a score for every trick.
  description: |
    Parkour is a third-person 3D parkour game set in a dense city district. It
    is an early vertical slice: one plaza, alley and rooftop block to run
    around in, with an animated character and an HDRI sky.

    Moves depend on context. Press Jump near an obstacle and the character
    vaults or climbs it, and how well you time the press decides the grade.
    Rolling softens a landing, slides carry your speed, and ledges can be
    grabbed, shimmied along and climbed.

    Tricks earn points that build into combos. Failed tricks and long falls
    cost health, and a fall from far enough up ends the run. It renders with
    WebGPU where available and falls back to WebGL2, with keyboard and mouse
    or a gamepad. Early days: weather and NPCs are still to come.
  playUrl: https://erikhellman.github.io/Parkour/
  browserPlayable: true
  repo: {owner: ErikHellman, name: Parkour}
