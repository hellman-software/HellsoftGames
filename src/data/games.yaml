  status: paused
  genre: Toy kart racing
  blurb: Big adventures. Tiny wheels. Race toy karts around three bedroom circuits, drift for boosts and unbox items. Play solo or race with friends online.
  description: |
    Micro Mayhem is a 3D toy kart racer set in a colourful bedroom. Pick one
    of four toy drivers and three karts, then race around Block Boulevard,
    Pillow Fort or Desk Dash, past giant alphabet blocks, cushions and pencils.

    Drift through corners to charge a boost and collect six toy items to
    shake up the race. Practise against seven bots, chase your personal best
