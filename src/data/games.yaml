- id: fimbulvetr
  title: Fimbulvetr
  order: 10
  listed: true
  status: released
  genre: Top-down action-adventure
  blurb: A Zelda-like set in a Norse-myth world. Rescue the villagers taken by the Rime King before the great winter swallows everything.
  description: |
    Ask, a farmhand, sets out to rescue Embla and the villagers taken by the
    servants of Hrímnir, the Rime King, whose rise brings on the Fimbulvetr:
    the great winter that precedes the end of the world.

    Fimbulvetr is a top-down action-adventure in the mould of A Link to the
    Past. The world has seasons, weather and a day/night cycle. You learn galdr
    (sung spells), take on side quests, hunt down heart pieces and clear
    dungeons across eight regions. The whole game is playable from start to
    finish, in English and Swedish.

    It runs entirely in the browser, installs as a progressive web app and
    saves locally, so you can pick it up where you left off.
