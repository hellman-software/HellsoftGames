- id: bilstold
  title: Bilstöld
  order: 40
  listed: true
  status: playable
  genre: Top-down open-world action
  blurb: GTA1-style car theft in a procedurally generated city. Steal cars, take payphone missions and play three gangs against each other.
  description: |
    Bilstöld ("car theft" in Swedish) is a top-down car-theft game in the
    spirit of the first two GTA games. Cities are built from a seed, so every
    city is different and any city can be revisited by entering its seed
    again.

    Steal any of 17 vehicle types, answer payphones for missions and play
    three gangs off against each other. The police escalate through six
    wanted levels, ending with army tanks. Four procedural radio stations
    keep you company: Radio Bilstöld, Hårdrock FM, Dansbandet and Lugna
    Favoriter.

    Every sprite, sound and font is generated in code. There are no asset
    files and no runtime dependencies. The game autosaves in your browser.
  playUrl: https://erikhellman.github.io/bilstold/
  repo: {owner: ErikHellman, name: bilstold}
