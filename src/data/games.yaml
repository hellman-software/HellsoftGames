- id: fantasy-sim-world
  title: Fantasy Sim World
  order: 20
  listed: true
  status: paused
  genre: AI-driven life simulation
  blurb: A 3D fantasy village where a dozen AI villagers live, gossip, marry and fight. Everyone who opens the page watches the same village.
  description: |
    Fantasy Sim World is a living fantasy village rendered in 3D, in the
    KayKit low-poly style. About a dozen villagers, each driven by a language
    model, go about their lives on a server that runs around the clock. They
    talk, make friends and enemies, marry, raise children and defend the
    village against the dead at night and orc raiders by day.

    There is weather, house fires, weddings and funerals, a coin economy,
    billboards, villager ambitions, ghosts, animals and a daily newspaper, the
    Valley Herald, that reports on what happened. Visitors can chat with the
    villagers as guests. The music adapts to what is going on.

    You do not control anyone. You watch, and everyone who opens the page sees
    the same village at the same moment.
  playUrl: http://fantasy-sim-world.hellsoft.se/
