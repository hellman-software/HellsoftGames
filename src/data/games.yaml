- id: dungeoncrawl
  title: DungeonCrawl
  order: 30
  listed: true
  status: playable
  genre: First-person roguelite
  blurb: A real-time first-person dungeon crawler. Reach the exit before the clock runs out, twenty levels down to the Necromancer King.
  description: |
    DungeonCrawl is a browser-only, single-player, first-person dungeon
    crawler with a roguelite structure. Levels are procedurally generated and
    timed: reach the exit before time runs out, or die and start the same
    depth again in a new layout.

    Pick one of three classes, find loot, trade at shops, avoid traps and
    fight bosses in sealed rooms. The final boss, the Necromancer King, waits
    at depth 20.

    It renders with WebGPU where available and falls back to WebGL2. Play
    with keyboard and mouse or a gamepad on a desktop browser. Tablets work
    with a controller or keyboard. Phones are not supported.
  playUrl: https://erikhellman.github.io/DungeonCrawl/
  repo: {owner: ErikHellman, name: DungeonCrawl}
